let mode=1,tl,ti,ok,miss,tend,tm,tim;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function setMode(m){mode=m;clearInterval(tm);$('m1').className=m==1?'':'s';$('m2').className=m==2?'':'s';$('nx').style.display='none';if(m==1)start();else startTest()}
$('m1').onclick=()=>setMode(1);$('m2').onclick=()=>setMode(2);
function startTest(){tl=[...Array(NAMES.length).keys()].map(i=>i+1).sort(()=>Math.random()-.5);ti=0;ok=0;miss=0;over=false;done=false;tim=cx.createImageData(base);tim.data.set(base.data);cx.putImageData(tim,0,0);tend=Date.now()+600000;clearInterval(tm);tick();tm=setInterval(tick,250);tnext()}
function tick(){const s=Math.max(0,Math.ceil((tend-Date.now())/1000));$('rd').textContent='⏱ '+fmt(s);if(s<=0&&!done)tfinish()}
function tnext(){cur=tl[ti];$('nm').textContent=NAMES[cur-1];$('sc').textContent=`✅ ${ok} · ❌ ${miss} · ${ti}/${NAMES.length}`;$('res').textContent='Klikni na mapu. Špatné a přeskočené území se označí červeně.';$('nx').style.display='';$('nx').textContent='Přeskočit'}
function tans(hit){const p=tim.data,c=hit?[90,200,120]:[230,90,80];for(let i=0;i<W*H;i++)if(ids[i]===cur&&p[i*4]>150&&p[i*4]<230){p[i*4]=c[0];p[i*4+1]=c[1];p[i*4+2]=c[2]}cx.putImageData(tim,0,0);
const nm=NAMES[cur-1];hit?ok++:miss++;ti++;if(ti>=NAMES.length){tfinish();return}tnext();$('res').innerHTML=hit?'✅ '+nm+' správně':'❌ '+nm+' bylo červeně označené území'}
function tfinish(){clearInterval(tm);done=true;over=true;const left=NAMES.length-ti;$('nm').textContent='Konec testu';$('sc').textContent=`✅ ${ok} · ❌ ${miss}`;$('res').innerHTML=`<b>${ok} / ${NAMES.length}</b> správně · chybně ${miss} · nestihl(a) jsi ${left}`;$('nx').style.display='';$('nx').textContent='Zkusit znovu'}
function bs(){$('bs').textContent=best?'Rekord '+best:''}
function start(){list=[...Array(NAMES.length).keys()].map(i=>i+1).sort(()=>Math.random()-.5).slice(0,5);rnd=0;score=0;over=false;next()}
function next(){cx.putImageData(base,0,0);done=false;cur=list[rnd];$('nm').textContent=NAMES[cur-1];$('rd').textContent='Kolo '+(rnd+1)+'/5';$('sc').textContent='Skóre '+score;$('res').textContent='Klikni na mapu.';$('nx').style.display='none';bs()}
function setZ(z){zoom=Math.max(1,Math.min(5,z));cv.style.width=zoom*100+'%'}
$('zi').onclick=()=>setZ(zoom+1);$('zo').onclick=()=>setZ(zoom-1);
cv.addEventListener('click',e=>{if(mode==2){if(done)return;const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);tans(ids[y*W+x]===cur);return}if(done)return;done=true;
 const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);

 const im=cx.createImageData(base);im.data.set(base.data);const p=im.data;
 for(let i=0;i<W*H;i++)if(ids[i]===cur){const px=i%W,py=(i/W)|0,d=(px-x)**2+(py-y)**2;if(d<m){m=d;bx=px;by=py}if(p[i*4]>150&&p[i*4]<230){p[i*4]=90;p[i*4+1]=200;p[i*4+2]=120}}
 cx.putImageData(im,0,0);
 const d=Math.sqrt(m)*KM,pts=hit?5000:Math.round(5000*Math.exp(-d/2.5));score+=pts;
 cx.strokeStyle='#d6402b';cx.fillStyle='#d6402b';cx.lineWidth=4;cx.setLineDash([10,8]);cx.beginPath();cx.moveTo(x,y);cx.lineTo(bx,by);cx.stroke();cx.setLineDash([]);
 cx.beginPath();cx.arc(x,y,10,0,7);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=3;cx.stroke();
 $('res').innerHTML=hit?'✅ <b>Trefa!</b> +5000 bodů':`Vedle o <b>${d.toFixed(1)} km</b> · +${pts} bodů`;
 $('sc').textContent='Skóre '+score;$('nx').style.display='';$('nx').textContent=rnd==4?'Výsledek':'Další'});
$('nx').onclick=()=>{if(mode==2){if(over)startTest();else if(!done)tans(false);return}if(over){start();return}if(rnd<4){rnd++;next()}else{if(score>best){best=score;try{localStorage.setItem('pg2',best)}catch(e){}}
